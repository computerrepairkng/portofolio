<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preview Sertifikat</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
            background-color: #333;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-family: sans-serif;
            text-align: center;
        }
    </style>
</head>
<body>
    <div id="loading" class="loading">Memuat Sertifikat...</div>
    <iframe id="pdf-frame"></iframe>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const file = urlParams.get('file');

        if (file) {
            fetch(file)
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.blob();
                })
                .then(blob => {
                    // Create an object URL from the blob. IDM cannot intercept this.
                    const blobUrl = URL.createObjectURL(blob);
                    document.getElementById('pdf-frame').src = blobUrl;
                    document.getElementById('loading').style.display = 'none';
                })
                .catch(error => {
                    console.error('Error fetching PDF:', error);
                    document.getElementById('loading').innerText = 'Gagal memuat sertifikat.';
                });
        } else {
            document.getElementById('loading').innerText = 'File tidak ditemukan.';
        }
    </script>
</body>
</html>
